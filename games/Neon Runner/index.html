<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Neon Runner</title>
<style>body{margin:0;background:#050516;color:#fff;font-family:Arial;text-align:center}canvas{background:linear-gradient(#080829,#02020b);display:block;margin:20px auto;max-width:95vw}button{padding:12px 22px}</style>
<h1>Neon Runner</h1><p>Use ← → ou A/D para desviar.</p><canvas id="c" width="500" height="600"></canvas><button onclick="reset()">Reiniciar</button>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let p,o,s=0,run=true,k={};function reset(){p={x:230,y:530,w:40,h:40};o=[];s=0;run=true;loop()}addEventListener('keydown',e=>k[e.key.toLowerCase()]=1);addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);function loop(){if(!run)return;x.clearRect(0,0,500,600);if(k.arrowleft||k.a)p.x-=6;if(k.arrowright||k.d)p.x+=6;p.x=Math.max(0,Math.min(460,p.x));if(Math.random()<.035)o.push({x:Math.random()*460,y:-30,w:40,h:40});o.forEach(q=>q.y+=5);o=o.filter(q=>q.y<620);x.fillStyle='#26e6ff';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#ff2cf0';o.forEach(q=>{x.fillRect(q.x,q.y,q.w,q.h);if(p.x<q.x+q.w&&p.x+p.w>q.x&&p.y<q.y+q.h&&p.y+p.h>q.y){run=false;alert('Fim! Pontos: '+s)}});s++;x.fillStyle='#fff';x.fillText('Pontos: '+Math.floor(s/10),15,25);requestAnimationFrame(loop)}reset()</script></html>
