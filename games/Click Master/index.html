<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Click Master</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#2156a0,#041331);color:#fff;font-family:Arial}.box{text-align:center}.coin{width:190px;height:190px;border-radius:50%;border:0;background:#ffd447;font-size:70px;box-shadow:0 12px 0 #bd8d16;cursor:pointer}.coin:active{transform:translateY(8px);box-shadow:0 4px 0 #bd8d16}.score{font-size:34px}.small{color:#b9c9e6}</style>
<div class="box"><h1>Click Master</h1><div class="score">Cliques: <span id="s">0</span></div><button class="coin" onclick="clicker()">👆</button><p class="small">Clique o máximo que conseguir.</p><button onclick="localStorage.removeItem('clicks');location.reload()">Resetar</button></div>
<script>let n=+(localStorage.getItem('clicks')||0);s.textContent=n;function clicker(){n++;s.textContent=n;localStorage.setItem('clicks',n)}</script></html>
