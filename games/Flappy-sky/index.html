<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Flappy Sky</title>
<style>body{margin:0;background:#69c9ff;font-family:Arial;text-align:center;overflow:hidden}canvas{display:block;margin:auto;background:linear-gradient(#69c9ff,#d9f5ff);max-width:100vw;max-height:100vh}#ui{position:fixed;top:10px;left:0;right:0;font-size:24px;font-weight:bold;color:#06305a}button{padding:12px 22px;border:0;font-weight:bold}</style>
<div id="ui">Pontos: <span id="score">0</span><br><button onclick="start()">Jogar / Reiniciar</button></div><canvas id="c" width="480" height="700"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let bird,pipe,score,running=false,raf;
function start(){bird={x:100,y:320,v:0};pipe={x:480,gap:180,y:180};score=0;running=true;loop()}
function flap(){if(!running)return;bird.v=-7}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')flap()});c.addEventListener('pointerdown',flap);
function loop(){if(!running)return;x.clearRect(0,0,c.width,c.height);bird.v+=.35;bird.y+=bird.v;pipe.x-=3;
if(pipe.x<-70){pipe.x=480;pipe.y=100+Math.random()*350;score++} 
x.fillStyle='#42a83b';x.fillRect(pipe.x,0,65,pipe.y);x.fillRect(pipe.x,pipe.y+pipe.gap,65,700);
x.font='38px Arial';x.fillText('🐦',bird.x-20,bird.y+14);document.getElementById('score').textContent=score;
if(bird.y<0||bird.y>700|| (bird.x+18>pipe.x&&bird.x-18<pipe.x+65&&(bird.y-18<pipe.y||bird.y+18>pipe.y+pipe.gap))){running=false;alert('Fim de jogo! Pontos: '+score)}else raf=requestAnimationFrame(loop)}
</script></html>
