<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayStation 4 Web Console</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="ps4-container">
    <!-- Barra Superior de Status -->
    <header class="top-bar">
      <div class="top-icons">
        <div class="icon-item"><i class="fa-solid fa-bell"></i></div>
        <div class="icon-item"><i class="fa-solid fa-user-group"></i></div>
        <div class="icon-item"><i class="fa-solid fa-trophy"></i></div>
        <div class="icon-item"><i class="fa-solid fa-gear"></i></div>
      </div>
      <div class="profile-info">
        <span id="clock">00:00</span>
        <div class="avatar-box">
          <i class="fa-solid fa-user"></i>
        </div>
      </div>
    </header>

    <!-- Carrossel Principal de Jogos -->
    <main class="carousel-wrapper">
      <div class="carousel" id="carousel">
        <div class="game-card active" data-url="games/flappy-sky/index.html">
          <div class="card-art sky">
            <i class="fa-solid fa-cloud-sun"></i>
          </div>
          <div class="card-title">Flappy Sky</div>
        </div>

        <div class="game-card" data-url="games/click-master/index.html">
          <div class="card-art clicker">
            <i class="fa-solid fa-hand-pointer"></i>
          </div>
          <div class="card-title">Click Master</div>
        </div>

        <div class="game-card" data-url="games/neon-runner/index.html">
          <div class="card-art runner">
            <i class="fa-solid fa-bolt"></i>
          </div>
          <div class="card-title">Neon Runner</div>
        </div>
      </div>
    </main>

    <!-- Rodapé com Botões de Ação -->
    <footer class="action-bar">
      <div class="prompt"><span class="btn-cross">X</span> Entrar</div>
      <div class="prompt"><span class="btn-circle">O</span> Opções</div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
