<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu PC Virtual</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body>

  <!-- ÁREA DE TRABALHO -->
  <div class="desktop">
    
    <!-- ÍCONES DA ÁREA DE TRABALHO -->
    <div class="desktop-icons">
      <div class="icon" onclick="openWindow('win-chrome')">
        <i class="fa-brands fa-chrome chrome-color"></i>
        <span>Google Chrome</span>
      </div>

      <div class="icon" onclick="openWindow('win-youtube')">
        <i class="fa-brands fa-youtube youtube-color"></i>
        <span>YouTube</span>
      </div>

      <div class="icon" onclick="openWindow('win-xodos')">
        <i class="fa-solid fa-heart xodo-color"></i>
        <span>Meus Xodós</span>
      </div>

      <div class="icon" onclick="openWindow('win-notes')">
        <i class="fa-solid fa-file-lines notes-color"></i>
        <span>Bloco de Notas</span>
      </div>
    </div>

    <!-- JANELA: CHROME -->
    <div class="window hidden" id="win-chrome">
      <div class="window-header">
        <div class="win-title"><i class="fa-brands fa-chrome"></i> Google Chrome</div>
        <div class="win-controls">
          <button onclick="closeWindow('win-chrome')">✕</button>
        </div>
      </div>
      <div class="browser-bar">
        <input type="text" id="chrome-url" value="https://www.bing.com" placeholder="Digite uma URL ou pesquisa...">
        <button onclick="navigateChrome()"><i class="fa-solid fa-arrow-right"></i> Ir</button>
      </div>
      <div class="window-body">
        <iframe id="chrome-iframe" src="https://www.bing.com"></iframe>
      </div>
    </div>

    <!-- JANELA: YOUTUBE -->
    <div class="window hidden" id="win-youtube">
      <div class="window-header">
        <div class="win-title"><i class="fa-brands fa-youtube"></i> YouTube Virtual</div>
        <div class="win-controls">
          <button onclick="closeWindow('win-youtube')">✕</button>
        </div>
      </div>
      <div class="window-body">
        <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>

    <!-- JANELA: SISTEMA DE XODÓS -->
    <div class="window hidden" id="win-xodos">
      <div class="window-header">
        <div class="win-title"><i class="fa-solid fa-heart"></i> Meus Xodós (Salvos)</div>
        <div class="win-controls">
          <button onclick="closeWindow('win-xodos')">✕</button>
        </div>
      </div>
      <div class="window-body xodo-body">
        <div class="xodo-form">
          <h3><i class="fa-solid fa-plus"></i> Adicionar Novo Xodó</h3>
          <input type="text" id="xodo-title" placeholder="Nome do Xodó (Ex: Meu Site, Jogo Favorito)">
          <input type="text" id="xodo-emoji" placeholder="Emoji (Ex: ⭐, 🎮, 🐱)" maxlength="2">
          <input type="text" id="xodo-link" placeholder="Link ou Anotação">
          <button onclick="addXodo()"><i class="fa-solid fa-floppy-disk"></i> Salvar Xodó</button>
        </div>
        <hr>
        <h3><i class="fa-solid fa-star"></i> Meus Itens Salvos</h3>
        <div class="xodo-grid" id="xodoContainer">
          <!-- Os Xodós serão carregados aqui -->
        </div>
      </div>
    </div>

    <!-- JANELA: BLOCO DE NOTAS -->
    <div class="window hidden" id="win-notes">
      <div class="window-header">
        <div class="win-title"><i class="fa-solid fa-file-lines"></i> Bloco de Notas</div>
        <div class="win-controls">
          <button onclick="closeWindow('win-notes')">✕</button>
        </div>
      </div>
      <div class="window-body">
        <textarea id="notepad" placeholder="Escreva suas anotações aqui... Elas serão salvas automaticamente!"></textarea>
      </div>
    </div>

  </div>

  <!-- BARRA DE TAREFAS -->
  <footer class="taskbar">
    <div class="start-btn"><i class="fa-brands fa-windows"></i> Iniciar</div>
    <div class="taskbar-apps">
      <span class="active-app-indicator" id="appIndicator">Nenhum app aberto</span>
    </div>
    <div class="system-tray">
      <span id="clock">00:00</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
